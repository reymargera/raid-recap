<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Mythic gold gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="30%" style="stop-color:#fff8dc"/>
      <stop offset="50%" style="stop-color:#ffd700"/>
      <stop offset="70%" style="stop-color:#b8860b"/>
      <stop offset="100%" style="stop-color:#daa520"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#0f0f19"/>

  <!-- Subtle purple inner glow -->
  <rect x="2" y="2" width="28" height="28" rx="5" fill="none" stroke="#8b5cf6" stroke-width="0.5" opacity="0.15"/>

  <!-- Corner accents -->
  <path d="M4 2 L9 2 M2 4 L2 9" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M23 2 L28 2 M30 4 L30 9" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M4 30 L9 30 M2 23 L2 28" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <path d="M23 30 L28 30 M30 23 L30 28" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Stylized "R" - elegant serif style, centered -->
  <g filter="url(#glow)" fill="url(#goldGradient)">
    <!-- Main vertical stroke -->
    <path d="M9 6 L9 26 L13 26 L13 18 L17 18 L22 26 L27 26 L21 17.5
             C24 16.5 26 14 26 11 C26 7.5 23 6 19 6 L9 6 Z
             M13 9.5 L18.5 9.5 C21 9.5 22.5 10.5 22.5 12
             C22.5 13.5 21 15 18.5 15 L13 15 L13 9.5 Z"/>
  </g>
</svg>
