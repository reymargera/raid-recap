main = "worker.ts"
name = "raid-recap"
compatibility_date = "2024-11-28"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Environment variables (non-sensitive)
[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "raid-recap-db"
database_id = "local-db"
migrations_dir = "drizzle/migrations"

# Production environment - deploy with: npm run deploy (or wrangler deploy)
[env.production]
vars = { ENVIRONMENT = "production" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "raid-recap-db"
database_id = "280c8d36-c4fb-4212-bef1-af8937e49475"
migrations_dir = "drizzle/migrations"

[[env.production.workflows]]
binding = "WORKFLOWS"
name = "process-report-workflow"
class_name = "ProcessReportWorkflow"

[[workflows]]
binding = "WORKFLOWS"
name = "process-report-workflow"
class_name = "ProcessReportWorkflow"
